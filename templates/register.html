{% extends "base.html" %}
{% block title %}Sign up — Tack{% endblock %}
{% block content %}
<section class="container auth-wrap">
  <form id="register-form" class="card-box auth-card" novalidate>
    <h1>Join your campus board</h1>
    <label class="field">Full name
      <input name="name" autocomplete="name" required>
    </label>
    <label class="field">College email
      <input name="email" type="email" autocomplete="email" required>
    </label>
    <label class="field">Phone number
      <input name="phone" inputmode="numeric" maxlength="10" required>
    </label>
    <label class="field">Hostel / block
      <select name="hostel" required>
        {% for h in hostels %}<option>{{ h }}</option>{% endfor %}
      </select>
    </label>
    <label class="field">Password (min 8 characters)
      <input name="password" type="password" autocomplete="new-password" required>
    </label>
    <p class="error" id="auth-error" hidden></p>
    <button class="btn btn-big" type="submit">Create account</button>
    <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </form>
</section>
{% endblock %}
