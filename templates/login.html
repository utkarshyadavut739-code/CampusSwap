{% extends "base.html" %}
{% block title %}Log in — Tack{% endblock %}
{% block content %}
<section class="container auth-wrap">
  <form id="login-form" class="card-box auth-card" data-next="{{ next }}" novalidate>
    <h1>Welcome back</h1>
    <label class="field">Email
      <input name="email" type="email" autocomplete="email" required>
    </label>
    <label class="field">Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <p class="error" id="auth-error" hidden></p>
    <button class="btn btn-big" type="submit">Log in</button>
    <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
